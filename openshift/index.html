<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenShift Discovery Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1EFEE; --surface:#FFFFFF; --surface-2:#F8F6F5; --ink:#1E1A19; --ink-2:#4D4644; --ink-3:#756D6A;
  --line:#DCD6D4; --line-2:#EAE5E3; --accent:#A3222A; --accent-ink:#FFFFFF; --accent-soft:#F6DEDE;
  --warn:#A94E08; --warn-soft:#FBE8D6; --bad:#B3261E; --bad-soft:#F9DEDB; --good:#2B7A30; --good-soft:#DDF0DE;
  --p-plat:#A3222A; --p-apps:#3553A0; --p-sec:#6A41A6; --p-ops:#0E6B63; --p-virt:#8E6300; --p-ai:#B03A7A;
  --shadow:0 1px 2px rgba(30,26,25,.06),0 4px 16px rgba(30,26,25,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121010; --surface:#1B1817; --surface-2:#221E1D; --ink:#EDE7E5; --ink-2:#BFB6B3; --ink-3:#958C89;
    --line:#3A3331; --line-2:#2B2625; --accent:#F2878B; --accent-ink:#2A0809; --accent-soft:#3A1A1B;
    --warn:#F0A35E; --warn-soft:#3A2616; --bad:#F2877F; --bad-soft:#3B1C1A; --good:#7FCB84; --good-soft:#18301A;
    --p-plat:#F2878B; --p-apps:#90A9EA; --p-sec:#B9A0EA; --p-ops:#4FC2B5; --p-virt:#E4B44A; --p-ai:#E88CC0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121010; --surface:#1B1817; --surface-2:#221E1D; --ink:#EDE7E5; --ink-2:#BFB6B3; --ink-3:#958C89;
  --line:#3A3331; --line-2:#2B2625; --accent:#F2878B; --accent-ink:#2A0809; --accent-soft:#3A1A1B;
  --warn:#F0A35E; --warn-soft:#3A2616; --bad:#F2877F; --bad-soft:#3B1C1A; --good:#7FCB84; --good-soft:#18301A;
  --p-plat:#F2878B; --p-apps:#90A9EA; --p-sec:#B9A0EA; --p-ops:#4FC2B5; --p-virt:#E4B44A; --p-ai:#E88CC0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:6px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;flex:none}
.brand h1{font-size:20px;line-height:1.1}
.brand small{display:block;font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.meter{display:flex;align-items:center;gap:10px;font:500 12px var(--f-mono);color:var(--ink-2)}
.meter .track{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:2px}
.rail .cust{padding:0 10px 12px;font-size:13px;color:var(--ink-3)}
.rail .cust b{display:block;color:var(--ink);font:600 15px/1.3 var(--f-body)}
.step{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink-2)}
.step:hover{background:var(--surface-2)}
.step[aria-current="step"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.step .n{font:500 11px var(--f-mono);color:var(--ink-3);text-align:center}
.step .dot{width:10px;height:10px;border-radius:50%;justify-self:center}
.step .lbl{font-size:14px;font-weight:500;line-height:1.25}
.step .cnt{font:500 11px var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.step .cnt.done{color:var(--good)}
.rail hr{border:0;border-top:1px solid var(--line);margin:8px 10px}
main{min-width:0}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.banner b{color:var(--warn)}
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.eyebrow .sw{width:8px;height:8px;border-radius:2px}
.head h2{font-size:30px;line-height:1.1}
.head p{margin:0;color:var(--ink-2);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--ink-3)}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2);line-height:1.2}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.rank{display:inline-flex;gap:6px;align-items:center}
.chip .rk{font:500 11px var(--f-mono);opacity:.85}
.chip.dim{opacity:.45}
.q{display:flex;flex-direction:column;gap:12px;padding-block:18px;border-top:1px solid var(--line-2)}
.q:first-child{border-top:0;padding-top:4px}
.qtop{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtop h3{font:600 16px/1.3 var(--f-body);letter-spacing:0}
.qid{font:500 11px var(--f-mono);color:var(--ink-3)}
.ask{margin:0;padding-left:12px;border-left:3px solid var(--line);color:var(--ink-2);font-size:14.5px}
.ask::before{content:"Ask  ";font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sc{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 4px;cursor:pointer;font:600 15px var(--f-mono);color:var(--ink-2)}
.sc:hover{border-color:var(--ink-3)}
.sc[aria-pressed="true"]{color:#fff;border-color:transparent}
.sc[aria-pressed="true"][data-v="1"],.sc[aria-pressed="true"][data-v="2"]{background:var(--bad)}
.sc[aria-pressed="true"][data-v="3"]{background:var(--warn)}
.sc[aria-pressed="true"][data-v="4"],.sc[aria-pressed="true"][data-v="5"]{background:var(--good)}
:root[data-theme="dark"] .sc[aria-pressed="true"]{color:#121010}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sc[aria-pressed="true"]{color:#121010}}
.anchors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:12.5px;color:var(--ink-3);line-height:1.4}
.anchors span b{font:600 11px var(--f-mono);color:var(--ink-2);margin-right:4px}
.anchors span:nth-child(2){text-align:center}.anchors span:nth-child(3){text-align:right}
.pillhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig b{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.scorebig span{font:500 12px var(--f-mono);color:var(--ink-3)}
.tag{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:5px}
.lv-1{background:var(--bad-soft);color:var(--bad)}.lv-2{background:var(--warn-soft);color:var(--warn)}.lv-3{background:var(--accent-soft);color:var(--accent)}.lv-4{background:var(--good-soft);color:var(--good)}.lv-0{background:var(--line-2);color:var(--ink-3)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ucform{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,.8fr) auto;gap:10px;align-items:end}
.tpls{display:flex;flex-direction:column;gap:8px}
.tpl{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.tpl:hover{border-color:var(--ink-3)}
.tpl .sw{width:10px;height:10px;border-radius:2px;margin-top:5px}
.tpl b{font-weight:600;font-size:14px;display:block}
.tpl span{font-size:12.5px;color:var(--ink-3)}
.tpl i{font:500 11px var(--f-mono);font-style:normal;color:var(--accent);white-space:nowrap}
.tpl[disabled]{opacity:.5;cursor:default}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);white-space:nowrap}
td.nw,th{white-space:nowrap}
td select{padding:5px 6px;width:auto}
.idx{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font:600 11px var(--f-mono);color:#fff}
:root[data-theme="dark"] .idx{color:#121010}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .idx{color:#121010}}
.matrix svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:12px;align-items:center}
.bar .nm{font-size:14px;font-weight:500}
.bar .tr{position:relative;height:14px;background:var(--surface-2);border-radius:4px;border:1px solid var(--line-2)}
.bar .fl{position:absolute;inset:0 auto 0 0;border-radius:3px}
.bar .v{font:600 14px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:12px}
.axis .ticks{position:relative;height:16px;font:500 10.5px var(--f-mono);color:var(--ink-3)}
.axis .ticks span{position:absolute;transform:translateX(-50%)}
.axis .ticks span:last-child{transform:translateX(-100%)}
.recs{display:flex;flex-direction:column;gap:0}
.rec{display:grid;grid-template-columns:4px minmax(0,1fr);gap:14px;padding-block:14px;border-top:1px solid var(--line-2)}
.rec:first-child{border-top:0}
.rec .stripe{border-radius:2px}
.rec h4{margin:0 0 3px;font-size:14.5px;font-weight:600}
.rec p{margin:0 0 8px;color:var(--ink-2);font-size:14px}
.prod{display:flex;flex-wrap:wrap;gap:6px}
.prod span{font:500 11.5px var(--f-mono);background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;padding:3px 7px;color:var(--ink-2)}
.motions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.motion{border:1px solid var(--line-2);border-radius:10px;padding:14px;background:var(--surface-2)}
.motion b{display:block;font-size:14.5px;margin-bottom:4px}
.motion span{font-size:13.5px;color:var(--ink-2)}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plan div{border-top:3px solid var(--accent);padding-top:10px}
.plan h4{margin:0 0 6px;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.plan ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kv div{font-size:13px;color:var(--ink-3)}
.kv b{display:block;color:var(--ink);font-size:14.5px;font-weight:600}
.muted{color:var(--ink-3);font-size:13.5px}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:10px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);z-index:20}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:8px;padding:10px 12px;font-size:14px}
h3.sec{font-size:18px;margin-bottom:12px}
.sectitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sectitle h3{font-size:18px}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px;margin-inline:-4px}
  .rail .cust,.rail hr{display:none}
  .step{grid-template-columns:auto auto;white-space:nowrap;flex:none}
  .step .cnt{display:none}
  .split,.motions{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .grid2,.plan{grid-template-columns:minmax(0,1fr)}
  .ucform{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ucform .f-name{grid-column:1/-1}
  .head h2{font-size:25px}
  .bar,.axis{grid-template-columns:92px minmax(0,1fr) 36px;gap:8px}
  .anchors{grid-template-columns:minmax(0,1fr)}
  .anchors span:nth-child(n){text-align:left}
  .meter .track{width:90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="1" width="9.5" height="15" rx="2.5" fill="var(--p-plat)"/>
        <rect x="12.25" y="1" width="9.5" height="15" rx="2.5" fill="var(--p-apps)"/>
        <rect x="23.5" y="1" width="9.5" height="15" rx="2.5" fill="var(--p-sec)"/>
        <rect x="1" y="18" width="9.5" height="15" rx="2.5" fill="var(--p-ops)"/>
        <rect x="12.25" y="18" width="9.5" height="15" rx="2.5" fill="var(--p-virt)"/>
        <rect x="23.5" y="18" width="9.5" height="15" rx="2.5" fill="var(--p-ai)"/>
      </svg>
      <div><small>Consulting · Red Hat OpenShift</small><h1>OpenShift Discovery Workbench</h1></div>
    </div>
    <div class="meter" id="meter"></div>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Discovery stages"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------- Content model ---------- */
const PILLARS = [
 {id:"plat", name:"Platform foundation", short:"Platform", color:"--p-plat",
  blurb:"Cluster strategy, deployment footprint, networking, storage and lifecycle: the foundation every workload on OpenShift depends on.",
  signals:["Clusters out of support","Kubernetes sprawl across teams","Datacentre refresh or exit","Hybrid or multi-cloud mandate","Edge or remote sites","Disconnected / air-gapped requirement"],
  qs:[
   {id:"pl1",t:"Container platform strategy",ask:"Do you run OpenShift or other Kubernetes today? How many clusters, and who owns the container platform strategy?",l1:"No container platform",l3:"A few clusters, per-team decisions",l5:"Platform strategy with a product owner and roadmap",rec:"Run an OpenShift platform design workshop to agree target topology, cluster tiers, tenancy and ownership.",w:["OpenShift Container Platform","Validated patterns","Platform design workshop"]},
   {id:"pl2",t:"Deployment footprint & topology",ask:"Where would clusters run: bare metal, vSphere, public cloud or edge? Is a managed service an option?",l1:"Undecided, no landing zone",l3:"Primary site chosen, ad hoc installs",l5:"Standard topology per tier, managed options assessed",rec:"Pick a reference topology per environment and decide between self-managed and managed OpenShift on cloud.",w:["Assisted / agent-based installer","Red Hat OpenShift Service on AWS","Azure Red Hat OpenShift"]},
   {id:"pl3",t:"Networking & ingress",ask:"How will traffic reach apps and backends: load balancers, DNS, egress control, network policy?",l1:"Unplanned, firewall tickets per app",l3:"Ingress designed, few network policies",l5:"Default-deny policy, egress IPs, automated DNS and LB",rec:"Design network patterns up front: ingress sharding, default-deny network policies and egress IPs for firewalled backends.",w:["OVN-Kubernetes","MetalLB","Gateway API"]},
   {id:"pl4",t:"Storage for stateful workloads",ask:"What storage would back stateful apps? Does it support dynamic provisioning, snapshots and replication?",l1:"No CSI, manual NFS",l3:"CSI for block, gaps for file and object",l5:"Block, file and object with snapshots and DR",rec:"Standardise storage classes; evaluate OpenShift Data Foundation where existing arrays lack CSI, snapshots or replication.",w:["OpenShift Data Foundation","Certified CSI drivers","Volume snapshots"]},
   {id:"pl5",t:"Lifecycle & upgrades",ask:"How current are the clusters, and how are upgrades planned, tested and rolled out?",l1:"Behind support, upgrades avoided",l3:"Manual upgrades within support",l5:"EUS-aware cadence, staged and tested upgrades",rec:"Set an upgrade policy aligned to update channels and EUS releases, with a staging cluster and pre-upgrade health checks.",w:["OpenShift update channels","EUS releases","Red Hat Insights"]}
  ]},
 {id:"apps", name:"Apps & developer experience", short:"Apps", color:"--p-apps",
  blurb:"Which applications move to containers, how they are built and released, and how quickly developers can get to production.",
  signals:["Commercial app-server licence renewal","Monthly or slower releases","Developers waiting weeks for environments","Java or .NET upgrade backlog","Microservices programme stalled"],
  qs:[
   {id:"ap1",t:"Portfolio & containerisation fit",ask:"How many apps are candidates for OpenShift, and has anyone assessed their fit (rehost, replatform, refactor, retain)?",l1:"No inventory",l3:"Inventory, no fit analysis",l5:"Wave plan backed by code analysis",rec:"Run Migration Toolkit for Applications analysis over priority repositories to size effort and shape migration waves.",w:["Migration Toolkit for Applications","6R assessment","Wave planning"]},

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pcol(id){return "var("+PMAP[id].color+")"}
function pillarScore(pid){const qs=PMAP[pid].qs;const vals=qs.map(q=>S.scores[q.id]).filter(Boolean);return {avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,n:vals.length,total:qs.length}}
function level(avg){if(avg==null)return{t:"Not assessed",c:0};if(avg<2)return{t:"Exploring",c:1};if(avg<3)return{t:"Emerging",c:2};if(avg<4)return{t:"Scaling",c:3};return{t:"Leading",c:4}}
function quadrant(u){const hv=u.value>=3,hf=u.feas>=3; if(hv&&hf)return"Quick win"; if(hv)return"Strategic bet"; if(hf)return"Fill-in"; return"Park"}
function totalQs(){return PILLARS.reduce((a,p)=>a+p.qs.length,0)}
function answered(){return Object.keys(S.scores).filter(k=>S.scores[k]&&QMAP[k]).length}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function stageProgress(st){
  if(st.kind==="setup"){const m=S.meta;const n=[m.customer,m.industry,m.size,m.stakeholders.length,m.footprint.length].filter(Boolean).length;return{t:n+"/5",done:n===5}}
  if(st.kind==="priorities"){return{t:S.priorities.length+"/3",done:S.priorities.length===3}}
  if(st.kind==="pillar"){const s=pillarScore(st.id);return{t:s.n+"/"+s.total,done:s.n===s.total}}
  if(st.kind==="usecases"){return{t:String(S.usecases.length),done:S.usecases.length>=3}}
  return{t:"",done:false};
}

function renderRail(){
  let h='<div class="cust"><b>'+esc(S.meta.customer||"New customer")+"</b>"+esc([S.meta.industry,S.meta.date].filter(Boolean).join(" · "))+"</div>";
  STAGES.forEach((st,i)=>{
    const pr=stageProgress(st);
    if(st.id==="usecases")h+="<hr>";

  });
  $("#rail").innerHTML=h;
  renderMeter();
}

  const i=STAGES.findIndex(s=>s.id===S.stage);

}

}
function render(){
  const st=STAGES.find(s=>s.id===S.stage)||STAGES[0];
  let h=banner();
  if(st.kind==="setup")h+=vSetup();
  else if(st.kind==="priorities")h+=vPriorities();
  else if(st.kind==="pillar")h+=vPillar(PMAP[st.id]);
  else if(st.kind==="usecases")h+=vUsecases();
  else h+=vSummary();
  if(st.kind!=="summary")h+=navRow();
  $("#main").innerHTML=h;
  renderRail();
}

function matrixSVG(list,small){
  const W=440,H=330,L=54,R=424,T=16,B=286;
  const X=f=>L+(f-1)/4*(R-L), Y=v=>B-(v-1)/4*(B-T);
  const mx=X(3),my=Y(3);
  let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Value versus feasibility matrix">';
  g+='<rect x="'+mx+'" y="'+T+'" width="'+(R-mx)+'" height="'+(my-T)+'" fill="var(--accent-soft)"/>';
  g+='<rect x="'+L+'" y="'+T+'" width="'+(R-L)+'" height="'+(B-T)+'" fill="none" stroke="var(--line)"/>';
  [1,2,3,4,5].forEach(i=>{
    g+='<line x1="'+X(i)+'" x2="'+X(i)+'" y1="'+T+'" y2="'+B+'" stroke="var(--line-2)"/>';
    g+='<line y1="'+Y(i)+'" y2="'+Y(i)+'" x1="'+L+'" x2="'+R+'" stroke="var(--line-2)"/>';
    g+='<text x="'+X(i)+'" y="'+(B+16)+'" text-anchor="middle" font-size="11" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">'+i+'</text>';
    g+='<text x="'+(L-10)+'" y="'+(Y(i)+4)+'" text-anchor="end" font-size="11" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">'+i+'</text>';
  });
  g+='<line x1="'+L+'" x2="'+R+'" y1="'+my+'" y2="'+my+'" stroke="var(--ink-3)" stroke-dasharray="4 4" opacity=".5"/><line x1="'+mx+'" x2="'+mx+'" y1="'+T+'" y2="'+B+'" stroke="var(--ink-3)" stroke-dasharray="4 4" opacity=".5"/>';
  const ql=(x,y,t,a)=>'<text x="'+x+'" y="'+y+'" text-anchor="'+a+'" font-size="11" font-weight="600" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)" letter-spacing=".06em">'+t+'</text>';
  g+=ql(R-8,T+16,"QUICK WINS","end")+ql(L+8,T+16,"STRATEGIC BETS","start")+ql(R-8,B-8,"FILL-INS","end")+ql(L+8,B-8,"PARK","start");
  g+='<text x="'+((L+R)/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="11.5" fill="var(--ink-2)" font-family="IBM Plex Sans,sans-serif">Feasibility →</text>';
  g+='<text transform="translate(14 '+((T+B)/2)+') rotate(-90)" text-anchor="middle" font-size="11.5" fill="var(--ink-2)" font-family="IBM Plex Sans,sans-serif">Business value →</text>';
  const groups={};
  list.forEach((u,i)=>{const k=u.value+"_"+u.feas;(groups[k]=groups[k]||[]).push([u,i])});
  Object.values(groups).forEach(arr=>{
    arr.forEach(([u,i],j)=>{
      let dx=0,dy=0; if(arr.length>1){const a=(j/arr.length)*Math.PI*2-Math.PI/2;dx=Math.cos(a)*15;dy=Math.sin(a)*15}
      const cx=Math.min(R-12,Math.max(L+12,X(u.feas)+dx)),cy=Math.min(B-12,Math.max(T+12,Y(u.value)+dy));
      g+='<g><title>'+esc(u.name)+'</title><circle cx="'+cx+'" cy="'+cy+'" r="11" fill="'+pcol(u.pillar)+'" stroke="var(--surface)" stroke-width="2"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="600" font-family="IBM Plex Mono,monospace" fill="var(--surface)">'+(i+1)+'</text></g>';
    });
  });
  return g+"</svg>";
}

/* ---------- Readout logic ---------- */
function compute(){
  const ps=PILLARS.map(p=>Object.assign({p},pillarScore(p.id)));
  const recs=[];
  PILLARS.forEach(p=>p.qs.forEach(q=>{const v=S.scores[q.id];if(v&&v<=3)recs.push({q,p,v})}));
  recs.sort((a,b)=>a.v-b.v);
  const uc=S.usecases.map((u,i)=>Object.assign({i:i+1,q:quadrant(u),score:u.value*u.feas},u)).sort((a,b)=>b.score-a.score||b.value-a.value);
  const quick=uc.filter(u=>u.q==="Quick win").sort((a,b)=>b.value-a.value||b.score-a.score);
  const sc=id=>S.scores[id]||0, avg=id=>pillarScore(id).avg;
  const M=[];
  const low=(id,t)=>sc(id)&&sc(id)<=t, has=(pid,s)=>(S.signals[pid]||[]).includes(s);
  const plA=avg("plat");
  if((plA!=null&&plA<3)||low("pl1",2))M.push({n:"OpenShift platform architecture & design workshop",w:"Platform foundations are early. Agree topology, tenancy, networking, storage and the upgrade policy before onboarding workloads."});
  const top=quick[0];
  if(top)M.push({n:"Pilot / proof of concept (4–6 weeks)",w:"Deliver “"+top.name+"” on a pilot cluster with a named team, agreed success criteria and production-grade guardrails."});
  if(low("op1",2)||low("ap4",2))M.push({n:"Open Innovation Labs–style residency",w:"Skills and self-service are the bottleneck. Embed a customer team with experienced coaches for 6–12 weeks to ship a real workload and learn GitOps and platform practices."});
  const apA=avg("apps");
  if((apA!=null&&apA<3)||low("ap1",2))M.push({n:"Application modernisation assessment (MTA + wave plan)",w:"Portfolio fit and runtimes are unclear. Analyse priority repositories, size effort and build waves around the licence and renewal triggers you heard."});
  if(low("ap3",2))M.push({n:"GitOps & platform engineering enablement",w:"Releases are manual. Stand up Argo CD and pipelines as a reusable baseline every team can adopt."});
  const vmA=avg("virt");
  if((vmA!=null&&vmA<3.5)||has("virt","VMware licensing change"))M.push({n:"VMware-to-OpenShift Virtualization assessment & pilot wave",w:"Hypervisor pressure is real. Build the inventory and business case against the renewal date, then prove the path with a pilot wave using MTV."});
  const seA=avg("sec");
  if((seA!=null&&seA<3)||low("se3",2))M.push({n:"Security posture & compliance assessment (ACS + Compliance Operator)",w:"Security gaps will block production approval. Baseline vulnerabilities, policy and compliance profiles alongside the pilot, not after it."});
  if(low("op3",2)||low("op4",2)||low("op5",2))M.push({n:"Day-2 operations design (ACM, Ansible, OADP)",w:"Fleet consistency, automation or DR are weak. Design hub-based management, automation and backup before the cluster count grows."});
  const aiA=avg("ai");
  if(aiA!=null&&aiA<3)M.push({n:"OpenShift AI discovery & pilot",w:"AI ambitions outpace the platform. Agree one use case, then stand up model serving and accelerator sharing on OpenShift AI."});
  M.push({n:"Confirm subscription model & commercial path",w:"Check sizing (cores vs bare-metal sockets), edition fit (Kubernetes Engine, Container Platform or Platform Plus), cloud marketplace commitments and partner funding with the Red Hat account team before scoping."});
  return {ps,recs,uc,quick,motions:M};
}
function planItems(c){
  const top=c.quick[0]||c.uc[0];
  const d30=["Play back this readout to the sponsor and confirm the top three outcomes",(c.motions[0]?"Schedule: "+c.motions[0].n:"Agree the first engagement"),top?"Confirm data access and owners for “"+top.name+"”":"Shortlist two or three use cases with the business"];
  const d60=[top?"Build and test “"+top.name+"” with a named user group":"Run a prototype on the highest-value use case","Stand up the pilot cluster, GitOps baseline and security guardrails the pilot needs","Collect baseline metrics for the business case"];
  const d90=["Present results and business case to the sponsor","Agree the production path, owners and support model","Line up the next two use cases from the map"];
  return [d30,d60,d90];
}

  const el=e.target.closest("button");if(!el)return;

  if(el.dataset.del){S.usecases=S.usecases.filter(u=>u.id!=el.dataset.del);save();render();return}
  const a=el.dataset.act;
  if(a==="adduc"){const n=$("#uc-name").value.trim();if(!n){$("#uc-name").focus();toast("Give the use case a name");return}S.usecases.push({id:S.seq++,name:n,pillar:$("#uc-p").value,value:+$("#uc-v").value,feas:+$("#uc-f").value});save();render();$("#uc-name").focus();return}
  if(a==="new"){
    const host=el.closest(".banner")||el.closest(".actions");
    if(document.getElementById("cf"))return;
    host.insertAdjacentHTML("afterend",'<div class="confirm" id="cf" style="margin-bottom:12px"><span>Clear everything and start a blank discovery?'+(S.sample?"":" Copy the session data first if you want to keep it.")+'</span><button class="btn sm danger" data-act="reset">Clear and start</button><button class="btn sm" data-act="cancel">Cancel</button></div>');return;
  }
  if(a==="cancel"){const c=document.getElementById("cf");if(c)c.remove();return}
  if(a==="reset"){S=blank();save();render();toast("Blank discovery started");return}
  if(a==="copymd"){copyText(markdown(),"Readout");return}
  if(a==="copyjson"){copyText(JSON.stringify(S),"Session data");return}
  if(a==="showimport"){$("#io").innerHTML='<div class="stack"><div class="field"><label for="io-paste">Paste session data</label><textarea id="io-paste" placeholder="Paste the text from “Copy session data”"></textarea></div><div class="actions"><button class="btn pri" data-act="doimport">Load session</button><label class="btn" for="io-file" style="display:inline-block">Choose a .json file</label><input type="file" id="io-file" accept=".json,application/json,text/plain" hidden></div></div>';return}
  if(a==="doimport"){if(!loadSession($("#io-paste").value))toast("That text isn't a saved discovery session");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="uc-name"){e.preventDefault();document.querySelector('[data-act="adduc"]').click()}});

render();
})();
</script>

</body>
</html>
